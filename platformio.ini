; ─────────────────────────────────────────────────────────────────────────────
; VESC BLE/WiFi Bridge
;
;   Plattform : pioarduino 55.03.39  ->  Arduino-Core 3.3.9 / ESP-IDF 5.5.4
;   BLE       : NimBLE-Arduino 2.5.0 (letztes Stable der 2.x-Linie)
;   LEDs      : Adafruit NeoPixel ^1.15.5
;   Chip      : ESP32-S3FH4R2 (4MB Flash + 2MB QUAD-PSRAM, beides im Package)
;
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram_type = qspi
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
    adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200
extra_scripts = post:generate_version.py, post:merge_firmware.py